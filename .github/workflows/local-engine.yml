name: Local Supabase integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-engine-evidence
          path: reports/integration/
          retention-days: 7
      - run: supabase stop
        if: always()
